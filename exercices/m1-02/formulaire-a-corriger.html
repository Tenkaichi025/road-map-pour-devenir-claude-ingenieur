<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Réserver une table</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; background: #fdf8f0; }
      .titre { font-size: 1.8rem; font-weight: bold; margin-bottom: 1rem; }
      input { display: block; width: 100%; padding: 0.6rem; margin-bottom: 0.8rem; font-size: 1rem; box-sizing: border-box; }
      .bouton { background: #c8462b; color: white; text-align: center; padding: 0.8rem; cursor: pointer; font-weight: bold; }
    </style>
  </head>
  <body>
    <!-- Ce formulaire a été généré par une IA. Il a l'air correct... -->
    <img src="logo.svg" width="80" height="80" />
    <div class="titre">Chez Tantie : réserver une table</div>

    <form action="" method="get">
      <input name="nom" placeholder="Ton nom" />
      <input name="email" type="text" placeholder="Ton e-mail" />
      <input type="tel" placeholder="Ton téléphone" />
      <input name="personnes" placeholder="Nombre de personnes" />
      <input name="date" placeholder="Date (jj/mm/aaaa)" />
      <div class="bouton" onclick="document.forms[0].submit()">Réserver</div>
    </form>
  </body>
</html>
